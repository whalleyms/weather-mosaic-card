<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Mosaic Card — Test Fixture</title>
  <script src="dist/weather-mosaic-card.js"></script>
  <style>
    /* Simulate a HA dark dashboard */
    :root {
      --ha-card-background: #1f2937;
      --card-background-color: #1f2937;
      --primary-text-color: #e5e7eb;
      --secondary-text-color: #9ca3af;
      --ha-card-header-color: #f9fafb;
      --divider-color: #374151;
      --error-color: #ef4444;
    }
    body {
      background: #111827;
      font-family: sans-serif;
      padding: 24px;
      margin: 0;
    }
    h1 {
      color: #6b7280;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 20px;
      max-width: 1400px;
    }
    weather-mosaic-card { display: block; }
  </style>
</head>
<body>
  <h1>Weather Mosaic Card — Test Fixture</h1>
  <div class="grid" id="cards"></div>

  <script>
    // -------------------------------------------------------------------------
    // Forecast generator — 7 days × 24 h of synthetic data
    // -------------------------------------------------------------------------
    function generateForecast({ baseTemp, swing, tzOffsetHours, conditions }) {
      const now   = new Date();
      const start = new Date(now);
      // Start at the top of the current UTC hour, back-filled to midnight local
      start.setUTCHours(start.getUTCHours() - ((start.getUTCHours() + tzOffsetHours + 24) % 24), 0, 0, 0);

      return Array.from({ length: 7 * 24 }, (_, h) => {
        const dt      = new Date(start.getTime() + h * 3_600_000);
        const localH  = ((dt.getUTCHours() + tzOffsetHours) + 24) % 24;
        // Coldest ~4 am, warmest ~3 pm local
        const cycle   = -Math.cos((localH - 4) / 24 * 2 * Math.PI);
        const temp    = Math.round((baseTemp + swing * cycle) * 10) / 10;
        const dayIdx  = Math.floor(h / 24);
        const cond    = conditions[dayIdx % conditions.length];
        const precip  = cond.includes('snow') ? 75
                      : cond.includes('rain') ? 65
                      : cond === 'cloudy'     ? 25
                      : 5;
        return { datetime: dt.toISOString(), temperature: temp,
                 precipitation_probability: precip, condition: cond };
      });
    }

    // -------------------------------------------------------------------------
    // Minimal mock hass object
    // -------------------------------------------------------------------------
    function makeMockHass(entityId, currentCondition, attrs, forecastOpts, extraStates) {
      const forecast = generateForecast(forecastOpts);
      return {
        states: {
          [entityId]: {
            state: currentCondition,
            attributes: { temperature_unit: '°F', ...attrs },
          },
          ...(extraStates || {}),
        },
        config: { latitude: attrs.latitude, longitude: attrs.longitude, time_zone: attrs.timezone },
        connection: {
          subscribeMessage(callback) {
            Promise.resolve().then(() => callback({ forecast }));
            return Promise.resolve(() => {});
          },
        },
      };
    }

    // -------------------------------------------------------------------------
    // Add a card to the page
    // -------------------------------------------------------------------------
    function addCard(config, hass) {
      const el = document.createElement('weather-mosaic-card');
      document.getElementById('cards').appendChild(el);
      el.setConfig(config);
      el.hass = hass;
    }

    // -------------------------------------------------------------------------
    // Test cards
    // -------------------------------------------------------------------------

    // Sunnyvale CA — mild, some rain mid-week
    addCard(
      { entity: 'weather.sunnyvale', title: 'Sunnyvale (PDT)',
        hours: 'above', time_format: '12' },
      makeMockHass('weather.sunnyvale', 'cloudy',
        { temperature: 62, latitude: 37.37, longitude: -122.04, timezone: 'America/Los_Angeles' },
        { baseTemp: 60, swing: 12, tzOffsetHours: -7,
          conditions: ['sunny','partlycloudy','cloudy','rainy','rainy','partlycloudy','sunny'] })
    );

    // Pittsburgh PA — cooler, snow early week
    addCard(
      { entity: 'weather.pittsburgh', title: 'Pittsburgh (EDT)',
        hours: 'above', time_format: '12' },
      makeMockHass('weather.pittsburgh', 'snowy',
        { temperature: 31, latitude: 40.44, longitude: -79.98, timezone: 'America/New_York' },
        { baseTemp: 38, swing: 16, tzOffsetHours: -4,
          conditions: ['snowy','snowy-rainy','cloudy','rainy','partlycloudy','sunny','sunny'] })
    );

    // Same card — Celsius / blue_red scale
    addCard(
      { entity: 'weather.sunnyvale', title: 'Sunnyvale — °C / Blue-Red',
        temperature_unit: 'C', color_scale: 'blue_red', hours: 'above', time_format: '24' },
      makeMockHass('weather.sunnyvale', 'cloudy',
        { temperature: 62, latitude: 37.37, longitude: -122.04, timezone: 'America/Los_Angeles' },
        { baseTemp: 60, swing: 12, tzOffsetHours: -7,
          conditions: ['sunny','partlycloudy','cloudy','rainy','rainy','partlycloudy','sunny'] })
    );

    // Minimal — no header, no labels
    addCard(
      { entity: 'weather.sunnyvale', title: '',
        show_current: false, show_minmax: false, show_precip: false, days: 5 },
      makeMockHass('weather.sunnyvale', 'sunny',
        { temperature: 68, latitude: 37.37, longitude: -122.04 },
        { baseTemp: 65, swing: 10, tzOffsetHours: -7,
          conditions: ['sunny','sunny','partlycloudy','cloudy','sunny','sunny','sunny'] })
    );

    // Local temperature override — weather entity says 62°F, local sensor says
    // 70.4°F. Header should show 70°F followed by the weather condition.
    addCard(
      { entity: 'weather.sunnyvale', title: 'Local Temp Override',
        temperature_entity: 'sensor.outdoor_temp', hours: 'above', time_format: '12' },
      makeMockHass('weather.sunnyvale', 'partlycloudy',
        { temperature: 62, latitude: 37.37, longitude: -122.04, timezone: 'America/Los_Angeles' },
        { baseTemp: 60, swing: 12, tzOffsetHours: -7,
          conditions: ['sunny','partlycloudy','cloudy','rainy','rainy','partlycloudy','sunny'] },
        { 'sensor.outdoor_temp': { state: '70.4', attributes: { unit_of_measurement: '°F', device_class: 'temperature', friendly_name: 'Outdoor Temp' } } })
    );

    // Custom color scale (advanced YAML) — stops defined inline as [temp, color].
    // Colors accept hex ("#rrggbb"/"#rgb") or [r,g,b]. This card should render with
    // this diverging palette, NOT a built-in scale. Change a hex value and reload to
    // confirm it's really using these stops.
    addCard(
      { entity: 'weather.pittsburgh', title: 'Custom Color Scale',
        custom_color_scale: [
          [20, '#313695'],
          [40, '#4575b4'],
          [55, '#ffffbf'],
          [70, '#f46d43'],
          [90, [165, 0, 38]],        // rgb-array form also accepted
        ],
        hours: 'above', time_format: '12' },
      makeMockHass('weather.pittsburgh', 'partlycloudy',
        { temperature: 48, latitude: 40.44, longitude: -79.98, timezone: 'America/New_York' },
        { baseTemp: 50, swing: 22, tzOffsetHours: -4,
          conditions: ['sunny','partlycloudy','cloudy','rainy','partlycloudy','sunny','sunny'] })
    );

    // Invalid custom scale (only one valid stop) — must FALL BACK to the named
    // color_scale (turbo here), not crash or render blank.
    addCard(
      { entity: 'weather.sunnyvale', title: 'Custom Fallback → turbo',
        color_scale: 'turbo',
        custom_color_scale: [ [50, 'not-a-color'] ],
        hours: 'above', time_format: '12' },
      makeMockHass('weather.sunnyvale', 'sunny',
        { temperature: 66, latitude: 37.37, longitude: -122.04, timezone: 'America/Los_Angeles' },
        { baseTemp: 64, swing: 12, tzOffsetHours: -7,
          conditions: ['sunny','sunny','partlycloudy','cloudy','sunny','sunny','sunny'] })
    );

    // Metric (°C) forecast — regression test for issue #3 (Meteo.LT, Lithuania).
    // The weather entity is native °C and the card is set to temperature_unit: C.
    // BEFORE the fix: the grid wrongly applied an °F→°C conversion, showing negative
    // numbers (~ -8 to -12) in an all-blue/cold palette. AFTER the fix: it shows the
    // real ~10–20°C values with temperate (green/yellow) colors, matching the header.
    addCard(
      { entity: 'weather.vilnius', title: 'Metric °C — issue #3', temperature_unit: 'C',
        hours: 'above', time_format: '24' },
      makeMockHass('weather.vilnius', 'cloudy',
        { temperature: 15.8, temperature_unit: '°C', latitude: 54.69, longitude: 25.28, timezone: 'Europe/Vilnius' },
        { baseTemp: 15, swing: 6, tzOffsetHours: 3,
          conditions: ['cloudy','rainy','partlycloudy','cloudy','rainy','partlycloudy','sunny'] })
    );

    // Spiral layout — each 360° turn is one 24 h day, winding inward into the
    // future. Midnight sits at 12 o'clock on every ring, so the same hour lines
    // up radially across days. Bands taper inward = less certainty.
    addCard(
      { entity: 'weather.sunnyvale', title: 'Spiral — 7 days (sun gaps)',
        layout: 'spiral', sun_gaps: true, hours: 'above', time_format: '12' },
      makeMockHass('weather.sunnyvale', 'cloudy',
        { temperature: 62, latitude: 37.37, longitude: -122.04, timezone: 'America/Los_Angeles' },
        { baseTemp: 60, swing: 12, tzOffsetHours: -7,
          conditions: ['sunny','partlycloudy','cloudy','rainy','rainy','partlycloudy','sunny'] })
    );

    // Spiral, colder + snow, 24 h clock — checks precip symbols and the taper.
    addCard(
      { entity: 'weather.pittsburgh', title: 'Spiral — Pittsburgh',
        layout: 'spiral', color_scale: 'blue_red', time_format: '24' },
      makeMockHass('weather.pittsburgh', 'snowy',
        { temperature: 31, latitude: 40.44, longitude: -79.98, timezone: 'America/New_York' },
        { baseTemp: 38, swing: 16, tzOffsetHours: -4,
          conditions: ['snowy','snowy-rainy','cloudy','rainy','partlycloudy','sunny','sunny'] })
    );

    // Spiral with fewer days — geometry must adapt to days: 4.
    addCard(
      { entity: 'weather.sunnyvale', title: 'Spiral — 4 days',
        layout: 'spiral', days: 4, color_scale: 'turbo' },
      makeMockHass('weather.sunnyvale', 'sunny',
        { temperature: 68, latitude: 37.37, longitude: -122.04, timezone: 'America/Los_Angeles' },
        { baseTemp: 65, swing: 14, tzOffsetHours: -7,
          conditions: ['sunny','partlycloudy','rainy','cloudy','sunny','sunny','sunny'] })
    );

    // Custom precipitation symbols (advanced YAML) — user-defined probability
    // levels, no temperature. Three bands: 70%+ "#", 40–69% "=", 15–39% ".".
    // The mock maps conditions to probabilities (snow 75, rain 65, cloudy 25,
    // sunny 5), so all three tiers appear across the week.
    addCard(
      { entity: 'weather.pittsburgh', title: 'Custom Precip Symbols', hours: 'above', time_format: '12',
        precipitation_symbols: [
          { symbol: '#', min_probability: 70 },
          { symbol: '=', min_probability: 40 },
          { symbol: '.', min_probability: 15 },
        ] },
      makeMockHass('weather.pittsburgh', 'rainy',
        { temperature: 40, latitude: 40.44, longitude: -79.98, timezone: 'America/New_York' },
        { baseTemp: 42, swing: 14, tzOffsetHours: -4,
          conditions: ['snowy','rainy','cloudy','sunny','rainy','snowy','cloudy'] })
    );

    // --- Sunrise/sunset gaps on the standard grid ---
    // Vertical gaps at the sunrise and sunset columns; sunrise/sunset computed
    // from coordinates. Home uses hass.config; a remote card supplies its own.

    // Home (Sunnyvale) — no coords needed, auto from hass.config
    addCard(
      { entity: 'weather.sunnyvale', title: 'Sun gaps — Home (auto from HA location)',
        sun_gaps: true, hours: 'above', time_format: '12' },
      makeMockHass('weather.sunnyvale', 'sunny',
        { temperature: 70, latitude: 37.37, longitude: -122.04, timezone: 'America/Los_Angeles' },
        { baseTemp: 66, swing: 16, tzOffsetHours: -7,
          conditions: ['sunny','partlycloudy','sunny','cloudy','sunny','partlycloudy','sunny'] })
    );

    // Remote (London) — its own latitude/longitude + timezone, gap 4px
    addCard(
      { entity: 'weather.london', title: 'Sun gaps — London (its own lat/lon), 4px',
        sun_gaps: true, sun_gap_width: 4, latitude: 51.5, longitude: -0.1, timezone: 'Europe/London',
        hours: 'above', time_format: '24' },
      makeMockHass('weather.london', 'partlycloudy',
        { temperature: 62, latitude: 51.5, longitude: -0.1, timezone: 'Europe/London' },
        { baseTemp: 60, swing: 10, tzOffsetHours: 1,
          conditions: ['partlycloudy','cloudy','rainy','partlycloudy','sunny','cloudy','rainy'] })
    );
  </script>
</body>
</html>
